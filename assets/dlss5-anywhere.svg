<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    DLSS5-Anywhere - the mark. One solid core with four blocks carried outward from it:
    the neural pass, and the reach that is the whole point of the tool - into DirectX 9,
    11 and 12, Vulkan, OpenGL and emulators, none of which shipped with it.

    Colours are the application's own, not invented for the icon: ACCENT_GREEN #46D07F to
    ACCENT_CYAN #5AB0F0 from theme.py, on BG_INPUT #0B0E14. The nav rail already marked
    the brand with a green rule, so the icon reads as part of the same product.

    This is the master, used at 32px and above. Below that the four satellites fall to
    about two pixels and turn to mush, so dlss5-anywhere-small.svg closes the same
    constellation up into a solid cross - see build_icon.py.
  -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46D07F"/>
      <stop offset="1" stop-color="#5AB0F0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="54" fill="#0B0E14"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="53.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.10"/>

  <!-- the core: the pass itself -->
  <rect x="92" y="92" width="72" height="72" rx="20" fill="url(#grad)"/>

  <!-- carried outward, north / east / south / west -->
  <g fill="url(#grad)" fill-opacity="0.55">
    <rect x="111" y="35"  width="34" height="34" rx="11"/>
    <rect x="187" y="111" width="34" height="34" rx="11"/>
    <rect x="111" y="187" width="34" height="34" rx="11"/>
    <rect x="35"  y="111" width="34" height="34" rx="11"/>
  </g>
</svg>
