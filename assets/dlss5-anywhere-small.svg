<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    The same mark drawn for 16, 20 and 24 pixels.

    At 16px the whole mark is about eleven pixels across. The master's satellites land at
    roughly two pixels with a one-pixel gap around each, which antialiases into grey
    smudges in the corners - so at these sizes the constellation closes up into a single
    solid cross: the same five blocks, touching, with the core still reading as the
    heaviest part of it.

    Dropping detail per size is what the .ico format exists for; it stores a separate
    image for each rather than one picture scaled down.
  -->
  <defs>
    <linearGradient id="grad-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46D07F"/>
      <stop offset="1" stop-color="#5AB0F0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="248" height="248" rx="52" fill="#0B0E14"/>

  <!-- one cross, drawn as two overlapping bars so it stays a single shape -->
  <g fill="url(#grad-s)">
    <rect x="96" y="40" width="64" height="176" rx="22"/>
    <rect x="40" y="96" width="176" height="64" rx="22"/>
  </g>
</svg>
